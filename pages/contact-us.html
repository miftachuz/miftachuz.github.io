<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leapmotor Solo Baru | Contact</title>

    <!-- Tab Icon -->
    <link rel="icon" type="image/png" href="/assets/img/logo-tab.png">

    <!-- Styles -->
    <link rel="stylesheet" href="/style.css">

    <!-- Scripts -->
    <script type="module" src="/app.js"></script>
    <script type="module" src="/assets/js/contact-us.js"></script>

</head>
<body>
    <nav-bar></nav-bar>

    <lp-hero src="/assets/img/contact-us@1x.jpg" text-pos="center"></lp-hero>

  
    <!-- Main Contact Section -->
    <section class="contact-section">
        <div class="contact-container">
            
            <div class="contact-header">
                <h2>CONNECT WITH US</h2>
                <p>Experience the future of everyday driving excitement. Schedule a test drive or request a premium consultation below.</p>
            </div>
      
            <a href="https://api.whatsapp.com/send?phone=+1234567890&text=Hello%20Leapmotor%20Solo%20Baru%2C%20my%20name%20is%20...%20I%20would%20like%20to%20learn%20more%20about%20..." 
                target="_blank" 
                class="whatsapp-quick-btn">
                CHAT VIA WHATSAPP NOW
            </a>
        
            <div class="form-divider">OR SUBMIT A REQUEST</div>

            <form id="form" class="contact-form">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" required placeholder="John">
                    </div>
                    
                    <div class="form-group">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" required placeholder="Doe">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="john.doe@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+62 ...">
                    </div>
                </div>

                <div class="form-group">
                    <label for="model">Model of Interest</label>
                    <select id="model">
                        <option value="b05">Leapmotor B05</option>
                        <option value="b10">Leapmotor B10</option>
                        <option value="c10">Leapmotor C10</option>
                        <option value="t03">Leapmotor T03</option>
                        <option value="general">General Inquiry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" rows="5" placeholder="Tell us how we can help you..."></textarea>
                </div>

                <button id="btn-submit" type="submit" class="submit-btn">SUBMIT REQUEST</button>
            </form>

        </div>
    </section>

    <lp-footer></lp-footer>
</body>
</html>
